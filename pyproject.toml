[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulst"
version = "0.1.0"
description = "Simultaneous Spanish-to-English speech translation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo Encalada" }]
dependencies = [
  "torch>=2.2",
  "transformers>=4.56",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "sacrebleu>=2.4",
  "huggingface_hub>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
app = ["gradio>=4.44"]

[project.scripts]
simulst-train = "simulst.train:main"
simulst-eval = "simulst.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
